[package]
name = "adelos-tests"
version = "0.1.0"
description = "Integration tests for Adelos Protocol"
edition = "2021"
publish = false

[workspace]
members = ["programs/*"]
resolver = "2"

[dependencies]
anchor-lang = "0.32.1"
solana-program = "1.18"
solana-sdk = "1.18"
litesvm = "0.2.0"
sha2 = "0.10"
borsh = "1.6"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
